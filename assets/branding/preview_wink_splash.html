<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Babymomo — Flirty Wink & Tilt Onboarding Splash Demo</title>
  <style>
    :root {
      --bg: #0D0E15;
      --primary: #8B5CF6;
      --coral: #FF6B8B;
      --amber: #FFAE33;
    }
    body {
      background-color: var(--bg);
      color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .phone-stage {
      background: #000;
      border-radius: 48px;
      padding: 12px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.8), 0 0 0 2px rgba(255,255,255,0.1);
      width: 340px;
      height: 680px;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .phone-screen {
      background: #0D0E15;
      border-radius: 38px;
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 1px solid rgba(255,255,255,0.08);
    }
    /* Mascot Splash Stage */
    .mascot-container {
      width: 180px;
      height: 180px;
      position: relative;
      cursor: pointer;
      /* Play animation sequence */
      animation: flirtyGreeting 3.2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .mascot-svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Flirty Wink and Head Tilt Keyframes */
    @keyframes flirtyGreeting {
      0% {
        transform: scale(0.6) translateY(30px);
        opacity: 0;
      }
      20% {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
      /* Sweet Head Tilt to the right */
      40% {
        transform: scale(1.05) translateY(-6px) rotate(12deg);
      }
      /* Stay tilted while winking */
      75% {
        transform: scale(1.05) translateY(-6px) rotate(12deg);
      }
      /* Settle back to gentle upright floating */
      90%, 100% {
        transform: scale(1) translateY(0) rotate(0deg);
        opacity: 1;
      }
    }
    /* Left Eye Normal / Right Eye Wink */
    .eye-right-open {
      animation: winkAnim 3.2s ease-in-out infinite;
      transform-origin: 307px 265px;
    }
    .eye-right-closed {
      animation: winkArchAnim 3.2s ease-in-out infinite;
      transform-origin: 307px 265px;
    }
    @keyframes winkAnim {
      0%, 45% { opacity: 1; transform: scaleY(1); }
      50%, 70% { opacity: 0; transform: scaleY(0.1); }
      75%, 100% { opacity: 1; transform: scaleY(1); }
    }
    @keyframes winkArchAnim {
      0%, 45% { opacity: 0; }
      50%, 70% { opacity: 1; }
      75%, 100% { opacity: 0; }
    }
    /* Ambient Glow behind mascot */
    .aura-glow {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 107, 139, 0.4) 0%, rgba(139, 92, 246, 0.2) 50%, transparent 70%);
      filter: blur(24px);
      z-index: 0;
      animation: pulseGlow 2.5s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.2); opacity: 1; }
    }
    .brand-title {
      font-size: 26px;
      font-weight: 800;
      margin-top: 24px;
      background: linear-gradient(135deg, #FFF 40%, #FF8E53 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .brand-tagline {
      color: #94A3B8;
      font-size: 13px;
      margin-top: 6px;
    }
    .controls {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }
    .replay-btn {
      background: linear-gradient(135deg, #FF6B8B, #FF8E53);
      color: #FFF;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 107, 139, 0.4);
    }
  </style>
</head>
<body>

  <div class="phone-stage">
    <div class="phone-screen">
      <div class="aura-glow"></div>

      <div class="mascot-container" id="mascot">
        <svg class="mascot-svg" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bodyGrad" x1="140" y1="120" x2="370" y2="430" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="70%" stop-color="#FFF5F5"/>
              <stop offset="100%" stop-color="#FED7AA"/>
            </linearGradient>
            <linearGradient id="earInner" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FDA4AF"/>
              <stop offset="100%" stop-color="#F43F5E"/>
            </linearGradient>
            <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FF4D6D" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="#FF4D6D" stop-opacity="0"/>
            </radialGradient>
            <filter id="mascotShadow" x="60" y="70" width="392" height="392" filterUnits="userSpaceOnUse">
              <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
            </filter>
          </defs>

          <!-- Shadow & Body -->
          <g filter="url(#mascotShadow)">
            <!-- Ears -->
            <ellipse cx="178" cy="162" rx="38" ry="50" transform="rotate(-18 178 162)" fill="#FFFFFF"/>
            <ellipse cx="178" cy="162" rx="23" ry="34" transform="rotate(-18 178 162)" fill="url(#earInner)"/>
            <ellipse cx="334" cy="162" rx="38" ry="50" transform="rotate(18 334 162)" fill="#FFFFFF"/>
            <ellipse cx="334" cy="162" rx="23" ry="34" transform="rotate(18 334 162)" fill="url(#earInner)"/>

            <!-- Mochi Body -->
            <path d="M 256 148 C 362 148, 396 208, 396 295 C 396 385, 348 406, 256 406 C 164 406, 116 385, 116 295 C 116 208, 150 148, 256 148 Z" fill="url(#bodyGrad)" stroke="#FFE4E6" stroke-width="2"/>
          </g>

          <!-- Rosy Cheeks -->
          <circle cx="175" cy="305" r="28" fill="url(#blushGrad)"/>
          <circle cx="337" cy="305" r="28" fill="url(#blushGrad)"/>

          <!-- Left Eye (Always Open, Big & Sparkly) -->
          <ellipse cx="205" cy="265" rx="20" ry="27" fill="#18181B"/>
          <ellipse cx="213" cy="253" rx="8" ry="11" fill="#FFFFFF"/>
          <circle cx="199" cy="277" r="4.5" fill="#FFFFFF"/>
          <circle cx="218" cy="275" r="2.5" fill="#FFFFFF" fill-opacity="0.8"/>

          <!-- Right Eye - Open State -->
          <g class="eye-right-open">
            <ellipse cx="307" cy="265" rx="20" ry="27" fill="#18181B"/>
            <ellipse cx="315" cy="253" rx="8" ry="11" fill="#FFFFFF"/>
            <circle cx="301" cy="277" r="4.5" fill="#FFFFFF"/>
            <circle cx="320" cy="275" r="2.5" fill="#FFFFFF" fill-opacity="0.8"/>
          </g>

          <!-- Right Eye - Flirty Wink Arc -->
          <g class="eye-right-closed">
            <path d="M 288 266 Q 307 252, 326 266" stroke="#18181B" stroke-width="6" stroke-linecap="round" fill="none"/>
            <!-- Cute Eyelash flicks -->
            <path d="M 324 263 L 332 258" stroke="#18181B" stroke-width="4.5" stroke-linecap="round"/>
          </g>

          <!-- Playful Smile -->
          <path d="M 242 290 Q 256 306, 270 290" stroke="#18181B" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M 249 297 Q 256 308, 263 297 Z" fill="#FB7185"/>

          <!-- Floating Magic Sparkle -->
          <path d="M 370 120 Q 376 138, 394 144 Q 376 150, 370 168 Q 364 150, 346 144 Q 364 138, 370 120 Z" fill="#FFFBEB"/>
        </svg>
      </div>

      <div class="brand-title">Babymomo</div>
      <div class="brand-tagline">Living AI Companion</div>
    </div>
  </div>

  <div class="controls">
    <button class="replay-btn" onclick="restartAnimation()">🔄 Replay Wink Animation</button>
  </div>

  <script>
    function restartAnimation() {
      const mascot = document.getElementById('mascot');
      mascot.style.animation = 'none';
      mascot.offsetHeight; /* trigger reflow */
      mascot.style.animation = 'flirtyGreeting 3.2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite';
    }
  </script>
</body>
</html>
