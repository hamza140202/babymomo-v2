name: Babymomo v2 Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./babymomo-v2

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK & SDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK (Universal & Split ABI)
        run: flutter build apk --split-per-abi --release

      - name: Build Android App Bundle (AAB for Play Store)
        run: flutter build appbundle --release

      - name: Package Release Artifacts
        run: |
          mkdir -p ../release_artifacts
          cp build/app/outputs/flutter-apk/*.apk ../release_artifacts/ || true
          cp build/app/outputs/bundle/release/*.aab ../release_artifacts/ || true

      - name: Upload Artifacts to Action Run
        uses: actions/upload-artifact@v4
        with:
          name: babymomo-v2-android-builds
          path: release_artifacts/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
